<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Next Watch - Global Movie Aggregator</title>
    <style>
        body { background-color: #0b0b0b; color: white; font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 0; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: rgba(0,0,0,0.8); border-bottom: 2px solid #E50914; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 24px; font-weight: bold; color: #E50914; display: flex; align-items: center; gap: 8px; }
        .search-container { padding: 15px; text-align: center; }
        .search-bar { width: 85%; max-width: 500px; padding: 12px; border-radius: 25px; border: 1px solid #333; background: #1c1c1c; color: white; font-size: 16px; outline: none; }
        .sub-banner { background: linear-gradient(to right, #1e1e1e, #2a2a2a); margin: 15px; padding: 15px; border-radius: 12px; border: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
        .sub-btn { background: #FFD700; color: black; border: none; padding: 8px 15px; font-weight: bold; border-radius: 20px; cursor: pointer; }
        .category-title { margin: 20px 15px 10px 15px; font-size: 20px; color: #f1f1f1; border-left: 4px solid #E50914; padding-left: 8px; }
        .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; padding: 15px; }
        .movie-card { background: #181818; border-radius: 8px; overflow: hidden; border: 1px solid #222; text-align: center; display: flex; flex-direction: column; }
        .movie-poster { width: 100%; height: 200px; object-fit: cover; }
        .movie-info { padding: 10px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .movie-title { font-size: 14px; margin: 5px 0; font-weight: bold; }
        .platform-tag { font-size: 11px; padding: 2px 6px; border-radius: 4px; display: inline-block; margin-bottom: 8px; text-transform: uppercase; font-weight: bold; }
        .netflix { background: #E50914; color: white; }
        .prime { background: #00A8E1; color: white; }
        .jiohotstar { background: #0F3CC9; color: white; }
        .marvel { background: #F0131E; color: white; }
        .watch-btn { background: #fff; color: #000; border: none; padding: 6px; border-radius: 4px; font-weight: bold; cursor: pointer; width: 100%; font-size: 13px; }
        
        /* In-App Video Player Section */
        .video-player-container { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; flex-direction: column; justify-content: center; align-items: center; }
        .video-wrapper { width: 90%; max-width: 700px; aspect-ratio: 16/9; background: #000; position: relative; }
        .video-wrapper iframe { width: 100%; height: 100%; border: none; }
        .close-player { background: #E50914; color: white; border: none; padding: 10px 20px; font-weight: bold; border-radius: 5px; margin-top: 15px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">👑 Next Watch 🔫</div>
    </div>

    <div class="sub-banner">
        <div>
            <div style="font-weight:bold; font-size:15px;">👑 Premium Access</div>
            <div style="font-size:12px; color:#aaa; margin-top:4px;">12 Days for ₹40 | 32 Days for ₹144</div>
        </div>
        <button class="sub-btn" onclick="openSubModal()">Activate</button>
    </div>

    <div class="search-container">
        <input type="text" id="searchInput" class="search-bar" placeholder="Search Netflix, JioHotstar, Marvel..." onkeyup="searchMovies()">
    </div>

    <div id="categories-container">
        <!-- Movies load here -->
    </div>

    <!-- Embedded In-App Player Screen -->
    <div id="videoPlayerModal" class="video-player-container">
        <div class="video-wrapper">
            <iframe id="videoIframe" src="" allowfullscreen></div>
        <button class="close-player" onclick="closeVideoPlayer()">❌ Close Video</button>
    </div>

    <script>
        // Real Embedded Youtube Streaming Links
        const moviesData = [
            // ACTION
            { title: "Avengers: Secret Wars", category: "Action", platform: "marvel", embedUrl: "https://youtube.com", img: "https://unsplash.com" },
            { title: "Jawan 2", category: "Action", platform: "jiohotstar", embedUrl: "https://youtube.com", img: "https://unsplash.com" },
            { title: "Spider-Man: Beyond the Spider-Verse", category: "Action", platform: "marvel", embedUrl: "https://youtube.com", img: "https://unsplash.com" },
            // THRILLER
            { title: "Stranger Things Season 5", category: "Thriller", platform: "netflix", embedUrl: "https://youtube.com", img: "https://unsplash.com" },
            { title: "Drishyam 3", category: "Thriller", platform: "jiohotstar", embedUrl: "https://youtube.com", img: "https://unsplash.com" },
            { title: "Citadel Season 2", category: "Thriller", platform: "prime", embedUrl: "https://youtube.com", img: "https://unsplash.com" },
            // COMEDY
            { title: "Hera Pheri 3", category: "Comedy", platform: "jiohotstar", embedUrl: "https://youtube.com", img: "https://unsplash.com" },
            { title: "Red Notice 2", category: "Comedy", platform: "netflix", embedUrl: "https://youtube.com", img: "https://unsplash.com" },
            // HORROR
            { title: "The Conjuring: Last Rites", category: "Horror", platform: "prime", embedUrl: "https://youtube.com", img: "https://unsplash.com" },
            { title: "Stree 3", category: "Horror", platform: "jiohotstar", embedUrl: "https://youtube.com", img: "https://unsplash.com" }
        ];

        function loadMovies(filterText = "") {
            const container = document.getElementById("categories-container");
            container.innerHTML = "";
            const categories = ["Action", "Thriller", "Comedy", "Horror"];

            categories.forEach(cat => {
                const filtered = moviesData.filter(m => m.category === cat && m.title.toLowerCase().includes(filterText.toLowerCase()));
                if (filtered.length > 0) {
                    const catSection = document.createElement("div");
                    catSection.innerHTML = `<div class="category-title">${cat} Movies</div>`;
                    const grid = document.createElement("div");
                    grid.className = "movie-grid";

                    filtered.forEach(movie => {
                        grid.innerHTML += `
                            <div class="movie-card">
                                <img class="movie-poster" src="${movie.img}" alt="${movie.title}">
                                <div class="movie-info">
                                    <div class="movie-title">${movie.title}</div>
                                    <span class="platform-tag ${movie.platform}">${movie.platform}</span>
                                    <button class="watch-btn" onclick="playVideo('${movie.embedUrl}')">Watch Now</button>
                                </div>
                            </div>
                        `;
                    });
                    catSection.appendChild(grid);
                    container.appendChild(catSection);
                }
            });
        }

        function playVideo(embedUrl) {
            const modal = document.getElementById("videoPlayerModal");
            const iframe = document.getElementById("videoIframe");
            iframe.src = embedUrl;
            modal.style.display = "flex";
        }

        function closeVideoPlayer() {
            const modal = document.getElementById("videoPlayerModal");
            const iframe = document.getElementById("videoIframe");
            iframe.src = "";
            modal.style.display = "none";
        }

        function searchMovies() {
            const query = document.getElementById("searchInput").value;
            loadMovies(query);
        }

        function openSubModal() {
            alert("👑 Next Watch Premium Activation:\n\nPlan 1: 12 Days for ₹40\nPlan 2: 32 Days for ₹144\n\nGoogle Play Payment Gateway Interface linking initiated!");
        }

        loadMovies();
    </script>
</body>
</html>
